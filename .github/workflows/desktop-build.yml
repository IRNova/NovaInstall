name: Desktop Build (CI)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Verify embedded UI is in sync
        shell: pwsh
        working-directory: desktop
        run: |
          python scripts/embed_ui.py --check

      - name: Build EXE
        shell: pwsh
        working-directory: desktop
        run: |
          pyinstaller --onefile --name NovaWizard --add-data "static;static" --icon app.ico nova_wizard.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NovaWizard-windows-x64
          path: desktop/dist/NovaWizard.exe
          if-no-files-found: error
