name: Desktop Build (CI)

on:
  push:
    branches: [main]
    paths:
      - "NovaInstall-main/desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "NovaInstall-main/desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        working-directory: NovaInstall-main/desktop
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Verify embedded UI is in sync
        shell: pwsh
        working-directory: NovaInstall-main/desktop
        run: |
          python scripts/embed_ui.py --check

      - name: Build EXE
        shell: pwsh
        working-directory: NovaInstall-main/desktop
        run: |
          pyinstaller --onefile --name NovaWizard --add-data "static;static" --icon app.ico nova_wizard.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaWizard-windows-x64
          path: NovaInstall-main/desktop/dist/NovaWizard.exe
          if-no-files-found: error
