name: Proxy Health Check (manual/scheduled)

on:
  workflow_dispatch:
    inputs:
      proxy_url:
        description: "Base URL of processing proxy (e.g. https://nova-install.example.workers.dev)"
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: proxy-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check proxy health and status endpoints
        id: check
        shell: bash
        env:
          PROXY_URL_INPUT: ${{ inputs.proxy_url }}
          PROXY_URL_SECRET: ${{ secrets.NOVA_PROXY_URL }}
          PROXY_URL_VAR: ${{ vars.NOVA_PROXY_URL }}
        run: |
          set -euo pipefail
          URL="${PROXY_URL_INPUT:-${PROXY_URL_SECRET:-${PROXY_URL_VAR:-}}}"
          if [ -z "$URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No proxy URL provided (input proxy_url or secret/var NOVA_PROXY_URL). Skipping."
            echo "### Proxy Health Check" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped: no proxy URL configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Checking $URL"
          set +e
          curl -fsS "$URL/health" -o /tmp/health.json
          H=$?
          curl -fsS "$URL/status.json" -o /tmp/status.json
          S=$?
          set -e
          if [ $H -ne 0 ] || [ $S -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "health_code=$H" >> "$GITHUB_OUTPUT"
            echo "status_code=$S" >> "$GITHUB_OUTPUT"
            echo "### Proxy Health Check" >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: FAILED (health=$H status=$S)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "### Proxy Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- /health: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- /status.json: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update incident issue on failure
        if: failure() && steps.check.outputs.skip != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROXY_URL: ${{ steps.check.outputs.url }}
        with:
          script: |
            const url = process.env.PROXY_URL || 'unknown';
            const label = 'ops/proxy-health';
            const title = 'Proxy health check failed';
            const body = [
              `Automated proxy health check failed.`,
              ``,
              `- URL: ${url}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Time: ${new Date().toISOString()}`,
              ``,
              `Please check /health and /status.json on the processing proxy.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'B60205', description: 'Automated proxy health incidents' }).catch(() => {});
            }

            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 20 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

      - name: Close incident issue on success
        if: success() && steps.check.outputs.skip != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROXY_URL: ${{ steps.check.outputs.url }}
        with:
          script: |
            const url = process.env.PROXY_URL || 'unknown';
            const label = 'ops/proxy-health';
            const title = 'Proxy health check failed';
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 20 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Health check recovered for ${url} at ${new Date().toISOString()}. Closing.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
