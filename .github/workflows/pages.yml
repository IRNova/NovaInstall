name: Deploy Pages (Installer UI)

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "stats.html"
      - "stats.json"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-pages
          mkdir -p dist-pages/assets
          cp index.html manifest.webmanifest sw.js stats.html stats.json .nojekyll dist-pages/
          cp -R assets/. dist-pages/assets/
          # Include only files needed by the public installer UI.
          test -f dist-pages/index.html
          test -f dist-pages/assets/nova-install.js
          test -f dist-pages/assets/proxy-endpoint.js

      - name: Upload installer UI artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
