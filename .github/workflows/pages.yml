name: Deploy Pages (Installer UI)

on:
  push:
    branches: ["main"]
    paths:
      - "NovaInstall-main/index.html"
      - "NovaInstall-main/assets/**"
      - "NovaInstall-main/manifest.webmanifest"
      - "NovaInstall-main/sw.js"
      - "NovaInstall-main/stats.html"
      - "NovaInstall-main/stats.json"
      - "NovaInstall-main/.nojekyll"
      - "NovaInstall-main/.github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload installer UI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: NovaInstall-main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
