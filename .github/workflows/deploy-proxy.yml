name: Deploy Installer Proxy

# پروکسی صفحهٔ نصب را روی Cloudflare Workers منتشر می‌کند.
# پیش‌نیاز: در Settings → Secrets and variables → Actions این دو را بساز:
#   CF_API_TOKEN   (Workers Scripts:Edit)
#   CF_ACCOUNT_ID  (اختیاری ولی پیشنهادی)
#
# بعد از اجرا، آدرس Worker در لاگ‌ها چاپ می‌شود؛ همان را در
# <meta name="nova-proxy" content="..."> در index.html بگذار.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-installer-proxy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nova-install proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy proxy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy
