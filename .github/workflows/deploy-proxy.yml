name: Deploy Installer Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-proxy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-installer-proxy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nova-install proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Cloudflare secret
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error title=Missing secret::Add CF_API_TOKEN in Settings → Secrets and variables → Actions (Account → Workers Scripts: Edit)."
            exit 1
          fi
          echo "CF_API_TOKEN is set."

      - name: Deploy proxy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy
          wranglerVersion: "4"

      - name: Smoke test deployed proxy
        shell: bash
        env:
          PROXY_URL_SECRET: ${{ secrets.NOVA_PROXY_URL }}
          PROXY_URL_VAR: ${{ vars.NOVA_PROXY_URL }}
        run: |
          set -euo pipefail
          URL="${PROXY_URL_SECRET:-${PROXY_URL_VAR:-}}"
          if [ -z "$URL" ]; then
            echo "::warning title=Smoke test skipped::Set NOVA_PROXY_URL secret/variable to enable post-deploy smoke checks."
            echo "### Deploy Proxy" >> "$GITHUB_STEP_SUMMARY"
            echo "- Deploy: OK" >> "$GITHUB_STEP_SUMMARY"
            echo "- Smoke test: skipped (NOVA_PROXY_URL not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL="${URL%/}"
          echo "Smoke testing $URL"
          curl -fsS "$URL/health" | tee /tmp/health.json
          curl -fsS "$URL/status.json" | head -c 4000 | tee /tmp/status.json >/dev/null
          echo
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(!h.ok) throw new Error('health not ok'); if(!h.version) throw new Error('missing version'); console.log('health ok', h.version);"
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/status.json','utf8')); if(!s.ok) throw new Error('status not ok'); console.log('status ok');"
          echo "### Deploy Proxy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: OK ($URL)" >> "$GITHUB_STEP_SUMMARY"
