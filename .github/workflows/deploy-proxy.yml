name: Deploy Installer Proxy

# پروکسی صفحهٔ نصب را روی Cloudflare Workers منتشر می‌کند.
# پیش‌نیاز: در Settings → Secrets and variables → Actions این را بساز:
#   CF_API_TOKEN   (Account → Workers Scripts: Edit)
#   CF_ACCOUNT_ID  (اختیاری ولی پیشنهادی)
#
# اگر پروکسی را دستی در داشبورد Cloudflare ساخته‌ای، نیازی به اجرای این workflow نیست.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-installer-proxy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nova-install proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare secret
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error title=Missing secret::Add CF_API_TOKEN in Settings → Secrets and variables → Actions (Account → Workers Scripts: Edit)."
            exit 1
          fi
          echo "CF_API_TOKEN is set."

      - name: Deploy proxy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy
          wranglerVersion: "4"
