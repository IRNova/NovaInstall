<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Nova Worker — نصب آسان</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg"/>
<link rel="preconnect" href="https://nameless-rain-87c6.altramax083.workers.dev" crossorigin/>
<style>
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/vazirmatn-var.woff2') format('woff2');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;background:#f4f6fb;color:#101622}
.box{text-align:center;padding:28px;max-width:400px}
.spin{width:28px;height:28px;border:3px solid #dde2eb;border-top-color:#0ea5c4;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
p{margin:0;font-size:14px;color:#445066;line-height:1.7}
a{color:#0ea5c4;font-weight:700}
.btn{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:12px;background:linear-gradient(120deg,#0891b2,#7c3aed);color:#fff;text-decoration:none;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="box"><div class="spin" id="spin"></div><p id="msg">بارگذاری صفحهٔ نصب…</p></div>
<script>
(async function () {
  var UI = "https://nameless-rain-87c6.altramax083.workers.dev";
  var msg = document.getElementById("msg");
  var spin = document.getElementById("spin");
  function fail(reason) {
    try { spin.style.display = "none"; } catch (e) {}
    msg.innerHTML = "بارگذاری طول کشید." +
      (reason ? "<br/><small style='color:#8a93a6'>" + reason + "</small>" : "") +
      "<br/><a class='btn' href='" + UI + "/'>باز کردن صفحهٔ نصب</a>";
  }
  function fetchWithTimeout(url, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, {
      headers: { "Accept": "text/html" },
      cache: "no-store",
      mode: "cors",
      signal: ctrl.signal
    }).finally(function () { clearTimeout(t); });
  }
  try {
    fetch(UI + "/health?warm=1&_t=" + Date.now(), { cache: "no-store", mode: "cors" }).catch(function () {});
  } catch (e) {}
  try {
    var res = await fetchWithTimeout(UI + "/?t=" + Date.now(), 20000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("entry-grid") === -1) throw new Error("bad ui");
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    console.error(err);
    fail(String(err && err.message ? err.message : err));
  }
})();
</script>
</body>
</html>
