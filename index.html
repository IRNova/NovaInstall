<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Nova Worker — نصب آسان</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg"/>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,system-ui,sans-serif;background:#f4f6fb;color:#101622}
.box{text-align:center;padding:24px}
.spin{width:28px;height:28px;border:3px solid #dde2eb;border-top-color:#0ea5c4;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
p{color:#445066;font-size:14px}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p id="m">بارگذاری صفحهٔ نصب…</p></div>
<script>
(async function(){
  var n = 10;
  var chunks = [];
  for (var i = 0; i < n; i++) {
    var r = await fetch("assets/ui-parts/p" + i + ".txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("part " + i + " HTTP " + r.status);
    chunks.push(await r.text());
  }
  var bin = Uint8Array.from(atob(chunks.join("")), function(c){ return c.charCodeAt(0); });
  var html = new TextDecoder("utf-8").decode(bin);
  document.open();
  document.write(html);
  document.close();
})().catch(function(e){
  document.getElementById("m").textContent = "خطا در بارگذاری: " + e;
});
</script>
</body>
</html>
