name = "nova-install"
main = "worker.js"
compatibility_date = "2025-11-04"
workers_dev = true

# Origin(s) allowed to call this proxy. Add your GitHub Pages origin here.
# Multiple origins can be separated with commas.
[vars]
ALLOWED_ORIGINS = "https://irnova.github.io"

# Durable background jobs: installation continues if the browser disconnects.
[[durable_objects.bindings]]
name = "INSTALL_JOBS"
class_name = "InstallJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstallJob"]

# Aggregate successful-install counter and public statistics page.
[[durable_objects.bindings]]
name = "INSTALL_STATS"
class_name = "InstallStats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InstallStats"]
